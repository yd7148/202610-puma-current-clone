<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ea611d">
<title>復刻示範｜船員證產生器</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 1. 旗幟感流動背景：兩層不同速度的 SVG 波浪 -->
<div class="flag-bg" aria-hidden="true"><i></i><i></i></div>

<!-- 2. 上下跑馬燈 -->
<div class="bar top"></div>

<main class="page">
  <h1 class="page-title">船員證產生器</h1>
  <p class="lead">三個步驟，一分鐘領到你的船員證。<br>這是復刻教學示範，非官方網站。</p>

  <ol class="steps">
    <li aria-current="step">1 填資料</li>
    <li>2 選艦隊</li>
    <li>3 領證</li>
  </ol>

  <section class="card">
    <h2>你的船員證</h2>
    <label class="lbl" for="name">證上要印的名字</label>
    <input class="field" id="name" maxlength="12" placeholder="名字或暱稱，最多 12 個字" autocomplete="nickname">

    <label class="lbl">你住哪裡？選你的艦隊</label>
    <div class="chips" id="fleets"></div>
    <p class="note">一人一張，領取後名字和艦隊不能再改，送出前再看一眼。</p>
  </section>

  <div class="toggles">
    <span class="tg-label">插畫版本</span>
    <button class="tg" id="artA" aria-pressed="true">A 木刻墨線</button>
    <button class="tg" id="artB" aria-pressed="false">B 幾何扁平</button>
    <span class="tg-label">底圖</span>
    <button class="tg" id="baseOff" aria-pressed="true">純向量</button>
    <button class="tg" id="baseOn" aria-pressed="false">用 1.png</button>
  </div>

  <button class="btn" id="gen" disabled>領取船員證</button>

  <section id="result" hidden>
    <div class="cardFrame" id="frame" data-state="loading">
      <img id="cardImg" alt="我的船員證">
      <span class="ph">船員證繪製中…</span>
    </div>
    <p class="lead" style="margin-top:4px">分享給朋友，邀請他們一起加入</p>
    <div class="row" style="display:flex;gap:10px;margin-top:6px">
      <button class="btn light" id="dl">下載 JPG</button>
      <button class="btn" id="share">分享</button>
    </div>
  </section>
</main>

<div class="bar bottom"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { installAssets } from './assets.js';
import { renderCard, loadBase } from './card.js';

installAssets();
const baseImg = await loadBase();

const $ = id => document.getElementById(id);
let OPT = { art: 'a', base: false };   // A/B 插畫 + 是否用底圖
const FLEETS = ['中山艦隊','大安艦隊','信義艦隊','松山艦隊','萬華艦隊','北投艦隊'];
const OTHER = '我不住台北市';

let fleet = '';
const canvas = document.createElement('canvas');
let lastBlob = null, lastUrl = '';

function toast(t) {
  const el = $('toast');
  el.textContent = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

for (const f of FLEETS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
  b.textContent = f;
  b.onclick = () => {
    fleet = f;
    for (const o of $('fleets').querySelectorAll('.chip')) o.setAttribute('aria-pressed', String(o === b));
    check();
  };
  $('fleets').append(b);
}
const wide = document.createElement('button');
wide.type = 'button'; wide.className = 'chip wide'; wide.textContent = OTHER;
wide.onclick = () => {
  fleet = OTHER;
  for (const o of $('fleets').querySelectorAll('.chip')) o.setAttribute('aria-pressed', String(o === wide));
  check();
};
$('fleets').append(wide);

function check() {
  $('gen').disabled = !$('name').value.trim() || !fleet;
}
$('name').oninput = check;

// ---- A/B 切換：改了要重畫預覽 ----
function bindToggle(id, apply) {
  $(id).onclick = () => {
    apply();
    // 同組的另一顆按鈕取消選中
    const group = $(id).parentElement;
    for (const b of group.querySelectorAll('.tg')) {
      if (!b.id.includes(id.match(/^(art|base)(A|B|On|Off)/)[1])) b.setAttribute('aria-pressed', 'false');
    }
    $(id).setAttribute('aria-pressed', 'true');
    if ($('result').hidden === false) $('gen').click();
  };
}
bindToggle('artA', () => OPT.art = 'a');
bindToggle('artB', () => OPT.art = 'b');
bindToggle('baseOff', () => OPT.base = false);
bindToggle('baseOn', () => OPT.base = !!baseImg);

$('gen').onclick = async () => {
  $('gen').disabled = true;
  $('gen').textContent = '領取中…';
  $('result').hidden = false;
  $('frame').dataset.state = 'loading';

  const serial = String(Math.floor(Math.random() * 900000) + 100000);
  await renderCard(canvas, { name: $('name').value.trim().slice(0, 12), fleet, serial }, OPT);

  lastBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  lastUrl = URL.createObjectURL(lastBlob);
  // 陷阱：img.decode() 在「圖片已完成載入」時可能永不 resolve，
  // 會讓整條 await 鏈卡死。先用 complete 判斷，未完成才 decode。
  const img = $('cardImg');
  img.src = lastUrl;
  if (!img.complete) await new Promise(res => { img.onload = img.onerror = res; });
  $('frame').dataset.state = 'ready';

  $('gen').disabled = false;
  $('gen').textContent = '領取船員證';
  toast('船員證領取完成');
};

$('dl').onclick = () => {
  if (!lastUrl) return;
  const a = document.createElement('a');
  a.href = lastUrl; a.download = '船員證.jpg';
  document.body.append(a); a.click(); a.remove();
};

$('share').onclick = async () => {
  const text = `我是${$('name').value.trim()}，已經加入${fleet}！`;
  if (lastBlob && navigator.canShare?.({ files: [new File([lastBlob], '船員證.jpg', { type: 'image/jpeg' })] })) {
    try {
      await navigator.share({
        files: [new File([lastBlob], '船員證.jpg', { type: 'image/jpeg' })],
        title: '船員證', text,
      });
      return;
    } catch {}
  }
  // 退化路徑：沒有 Web Share Level 2 就純文字分享
  try { await navigator.share({ title: '船員證', text }); }
  catch { toast('已複製：' + text); }
};
</script>
</body>
</html>
